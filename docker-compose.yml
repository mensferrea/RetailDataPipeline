services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    restart: always
    environment:
      POSTGRES_DB: retail_dwh
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: retail_app
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: retail_dwh
      DB_USER: retail_user
      DB_PASSWORD: retail_password
      DATABASE_URL: postgresql+psycopg2://retail_user:retail_password@postgres:5432/retail_dwh
      API_HOST: 0.0.0.0
      API_PORT: 8000
      INVENTORY_API_URL: http://localhost:8000/api/v1/source/inventory
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
